<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>cover 3:4</title>
<style>
  html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#0b0c10}
  #m{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:5px;background:#0b0c10}
  #m div{background-size:cover;background-position:center;position:relative}
  #m div::after{content:attr(data-n);position:absolute;left:10px;top:8px;font:700 17px 'Inter Display';color:rgba(255,255,255,.8);text-shadow:0 1px 4px rgba(0,0,0,.7)}
  #shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,12,.15) 0%,rgba(8,9,12,.82) 26%,rgba(8,9,12,.92) 50%,rgba(8,9,12,.82) 72%,rgba(8,9,12,.12) 100%)}
  #t{position:absolute;left:0;right:0;top:395px;text-align:center;color:#fff;font-family:'Noto Sans CJK SC'}
  #t .n{font:900 300px/0.86 'Inter Display';letter-spacing:-.03em}
  #t .a{font-weight:900;font-size:128px;letter-spacing:.04em;margin-top:4px;line-height:1.1}
  #t .badge{display:inline-block;margin-top:26px;font-weight:900;font-size:68px;letter-spacing:.12em;color:#14110c;background:#ffc93c;border-radius:18px;padding:6px 34px 10px 46px}
  #t .b{font-weight:700;font-size:38px;letter-spacing:.14em;color:rgba(255,255,255,.88);margin-top:30px}
  #t .c{font:600 18px Inter;letter-spacing:.42em;color:rgba(255,255,255,.5);margin-top:22px}
</style></head><body>
<div id="m"></div><div id="shade"></div>
<div id="t"><div class="n">20</div><div class="a">种视频风格</div><div class="badge">第二期</div><div class="b">每一帧，都是代码算出来的</div><div class="c">XIAOXIONG · STYLE REEL · EP.02</div></div>
<script>
const P = { '01': 150, '02': 150, '03': 210, '04': 180, '05': 255, '06': 126, '07': 270, '08': 200, '09': 270, '10': 255, '11': 270, '12': 150, '13': 250, '14': 156, '15': 150, '16': 255, '17': 285, '18': 285, '19': 138, '20': 174 };
const m = document.getElementById('m');
Object.keys(P).sort().forEach((id) => { const d = document.createElement('div'); d.dataset.n = id; d.style.backgroundImage = `url(../frames/${id}/f${String(P[id]).padStart(5, '0')}.jpg)`; m.appendChild(d); });
</script></body></html>
