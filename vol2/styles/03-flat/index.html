<script>

const FLOOR = 1500;
const ZIG = [[60, 120], [620, 260], [140, 400], [880, 560]]; // marble ramp polyline (zig-zag)

    if (t > 6.0) { const q = E.inOutCubic(clamp((t - 6.0) / 0.6)); cx = lerp(cx, TILE.x0 + 2 * (TILE.w + TILE.gap), q); cy = lerp(cy, FLOOR - 100, q); z = lerp(z, 0.85, q) * (1 + 0.03 * clamp((t - 7) / 3)); } }
  return { cx, cy, z };
}
