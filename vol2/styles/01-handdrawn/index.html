<script>
/* ===== 01 逐帧手绘 · 夏夜烟火 =====

  { tl: EV.launchB, tb: EV.burstB, x0: 700, x: 760, y: 230, R: 210, col: [255, 95, 162], n: 22, kind: 'peony' },
  { tl: 1.5, tb: EV.burstC, x0: 1100, x: 1130, y: 340, R: 120, col: [95, 224, 255], n: 16, kind: 'peony' },
  { tl: 1.75, tb: EV.burstD, x0: 1520, x: 1500, y: 390, R: 105, col: [95, 224, 255], n: 14, kind: 'peony' },
  { tl: 2.0, tb: EV.crackle, x0: 1010, x: 1000, y: 200, R: 170, col: [255, 226, 150], n: 40, kind: 'crackle' },
  { tl: EV.launchF, tb: EV.hook, x0: 960, x: 960, y: 300, R: 560, col: [255, 196, 90], n: 72, kind: 'chrys' },
  { tl: 7.1, tb: 7.6, x0: 500, x: 520, y: 320, R: 95, col: [255, 95, 162], n: 14, kind: 'peony' },
  { tl: 7.9, tb: 8.4, x0: 1640, x: 1620, y: 290, R: 110, col: [95, 224, 255], n: 14, kind: 'peony' },

const J = (i, a = 0.8) => (hash(i * 7.13 + JF * 1.7) - 0.5) * 2 * a;  // per-drawing hand jitter

const r0 = rng(7);

      for (let d = 0; d < dashes; d++) {

// ---------- town ----------

}

function reflection(t, bx) {

  }
  const wv = g.createLinearGradient(0, top, 0, 1080); wv.addColorStop(0, 'rgba(28,30,72,.55)'); wv.addColorStop(1, 'rgba(10,11,34,.92)'); g.fillStyle = wv; g.fillRect(0, top, 1920, 1080 - top);
  // drawn ripple lines
  g.strokeStyle = 'rgba(190,190,255,.18)'; g.lineWidth = 2; for (let k = 0; k < 26; k++) { const y = top + 20 + hash(k) * 400, x = hash(k + 9) * 1920, w = 40 + hash(k + 3) * 120; g.beginPath(); g.moveTo(x + J(k, 3), y); g.lineTo(x + w + J(k + 1, 3), y); g.stroke(); }
  // boat lantern streak
  const lx = bx - 104; for (let k = 0; k < 9; k++) { g.fillStyle = `rgba(255,140,80,${0.42 - k * 0.04})`; g.fillRect(lx - 10 + J(k, 4) + Math.sin(k + JF) * 4, HZ + 80 + k * 18, 20 - k, 5); }
}
// ---------- foreground: roof ridge with cat, willow ----------
function foreground(c, t, Lt) {
  c.save(); c.translate(-60, -40); c.scale(1.25, 1.25); c.translate(0, -180);
  poly(c, [[-40, 1100], [-40, 900], [380, 860], [640, 930], [640, 1100]], '#16142a', '#0c0b1a', 2.6, 1300);
  c.strokeStyle = rgb(Lt.col, Math.min(0.9, 0.15 + Lt.L * 0.6)); c.lineWidth = 3.5; c.beginPath(); c.moveTo(-40, 900); c.lineTo(380, 860); c.lineTo(640, 930); c.stroke();
  for (let k = 0; k < 12; k++) { c.strokeStyle = '#211e3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(k * 52, 905 - k * 3); c.lineTo(k * 52 + 10, 1100); c.stroke(); }
  // cat sitting on the ridge, back to us
  const cx = 300, cy = 858, turn = E.outCubic(clamp((t - EV.catTurn) / (2 / 12)));
  const ear = Math.abs(t - EV.ear) < 1.5 / 12 ? -8 : 0;
  const tail = Math.sin(t * 1.6) * 0.5;
  c.fillStyle = '#0c0b1a';
  c.beginPath(); c.ellipse(cx, cy - 46, 40, 52, 0, 0, 6.3); c.fill();                // body
  const hx = cx + lerp(-14, 12, turn), hy = cy - 108 - turn * 6;
  c.beginPath(); c.ellipse(hx, hy, 30, 26, lerp(-0.25, 0.2, turn), 0, 6.3); c.fill();   // head
  poly(c, [[hx - 26, hy - 10], [hx - 20 + ear * 0.4, hy - 46 + ear], [hx - 6, hy - 20]], '#0c0b1a', null, 1, 1400);
  poly(c, [[hx + 6, hy - 22], [hx + 20, hy - 48], [hx + 26, hy - 10]], '#0c0b1a', null, 1, 1410);
  c.strokeStyle = '#0c0b1a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(cx + 30, cy - 8); c.quadraticCurveTo(cx + 96, cy - 4 + tail * 20, cx + 92 + tail * 30, cy - 66); c.stroke();
  // rim light on the cat from the sky
  c.strokeStyle = rgb(Lt.col, Math.min(0.95, 0.2 + Lt.L * 0.7)); c.lineWidth = 3; c.beginPath(); c.ellipse(hx, hy, 30, 26, lerp(-0.25, 0.2, turn), -2.6, -0.4); c.stroke();
  c.beginPath(); c.ellipse(cx, cy - 46, 40, 52, 0, -2.8, -1.6); c.stroke();
  c.restore();
  // willow from the top right, pushed by the hook's blast
  const blast = spring(t - EV.hook, { k: 60, c: 4 }) * Math.exp(-Math.max(0, t - EV.hook) * 0.8) * (t > EV.hook ? 1 : 0);
  for (let k = 0; k < 16; k++) {
    const x0 = 1500 + k * 30 + hash(k) * 20, len = 380 + hash(k + 3) * 320, sw = Math.sin(t * 1.3 + k * 0.6) * 14 + blast * 60;
    c.strokeStyle = k % 3 ? '#16302e' : '#1f3d36'; c.lineWidth = 3; c.beginPath(); c.moveTo(x0, -10);
    c.quadraticCurveTo(x0 + sw * 0.4 + J(k, 1.5), len * 0.5, x0 + sw + J(k + 2, 1.5), len); c.stroke();
    for (let q = 1; q < 9; q++) { const u = q / 9, x = x0 + sw * u * u, y = len * u; c.fillStyle = q % 2 ? '#1c3a33' : '#24493f'; c.beginPath(); c.ellipse(x + 6 + J(q + k, 1), y, 4, 11, 0.3, 0, 6.3); c.fill(); c.beginPath(); c.ellipse(x - 6, y + 4, 4, 11, -0.3, 0, 6.3); c.fill(); }
  }
}
// ---------- title ----------
function title(c, t) {
  const a = t - EV.title; if (a < 0) return;
  const f = Math.floor(a * 12), cx = 960, cy = 150;
  c.save(); c.globalCompositeOperation = 'lighter';
  if (f === 0) { c.fillStyle = 'rgba(255,250,220,1)'; c.beginPath(); for (let i = 0; i < 16; i++) { const an = i / 16 * 6.283, rr = i % 2 ? 14 : 70; c.lineTo(cx + Math.cos(an) * rr, cy + Math.sin(an) * rr); } c.fill(); c.restore(); return; }
  const k = f === 1 ? 0.7 : 1;
  c.font = `900 ${Math.round(140 * k)}px "Noto Serif CJK SC"`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(255,190,80,.9)'; c.shadowBlur = 40; c.fillStyle = 'rgba(255,214,120,.55)'; c.fillText(C.title, cx, cy);
  c.shadowBlur = 0; c.fillStyle = '#ffe3a0'; c.fillText(C.title, cx + J(1, 1.2), cy + J(2, 1.2));
  c.strokeStyle = 'rgba(255,255,235,.9)'; c.lineWidth = 2; c.strokeText(C.title, cx + J(3, 1.2), cy + J(4, 1.2));
  c.font = '700 30px Inter'; c.letterSpacing = '14px'; c.fillStyle = 'rgba(255,226,170,.9)'; c.fillText(C.en, cx + 7, cy + 112);
  // falling sparks off the lettering
  for (let i = 0; i < 26; i++) { const sx = cx - 300 + hash(i) * 600, sy = cy + 50 + ((a * 60 + hash(i + 5) * 120) % 160); if (hash(i + f) < 0.35) continue; c.fillStyle = `rgba(255,220,140,${0.8 - (sy - cy - 50) / 220})`; c.fillRect(sx, sy, 3, 3); }
  c.restore();
}

Reel.scene({
  duration: 10, fps: 30,
  fonts: ['900 140px "Noto Serif CJK SC"', '700 30px Inter'],
  frameKey: fk,
  async setup() {
    const r = rng(3); // gouache paper / brush texture
    tx.fillStyle = '#808080'; tx.fillRect(0, 0, 1920, 1080);
    for (let i = 0; i < 9000; i++) { const v = 110 + r() * 40; tx.fillStyle = `rgba(${v},${v},${v},.10)`; const x = r() * 1920, y = r() * 1080; tx.beginPath(); tx.ellipse(x, y, 8 + r() * 40, 2 + r() * 5, r() * 0.4 - 0.2, 0, 6.3); tx.fill(); }
  },
  cues: [
    { t: 0.02, sfx: 'swell', gain: 0.5 }, { t: EV.boat, sfx: 'drip', gain: 0.3 }, { t: EV.launchB, sfx: 'whoosh_up', gain: 0.5 }, { t: EV.burstB, sfx: 'impact', gain: 0.5 },
    { t: EV.burstC, sfx: 'pop', gain: 0.6 }, { t: EV.burstD, sfx: 'pop', gain: 0.55 }, { t: EV.crackle, sfx: 'sparkle', gain: 0.6 }, { t: EV.launchF, sfx: 'riser_short', gain: 0.6 },
    { t: EV.hook, sfx: 'impact', gain: 1.0 }, { t: EV.hook + 0.05, sfx: 'sparkle', gain: 0.7 }, { t: EV.bridge, sfx: 'drip', gain: 0.3 }, { t: EV.title, sfx: 'chime', gain: 0.8 },
    { t: 7.6, sfx: 'pop', gain: 0.35 }, { t: 8.4, sfx: 'pop', gain: 0.35 }],
  render(t) {
    t = fk(t) / 12; JF = fk(t);
    const Lt = lightAt(t);
    // upper world -> offscreen (also the source of the river reflection)
    u.setTransform(K, 0, 0, K, 0, 0); u.globalCompositeOperation = 'source-over'; u.globalAlpha = 1;
    sky(u, t, Lt);
    for (const s of SHELLS) shell(u, s, t);
    title(u, t);
    town(u, t, Lt);
    cv.begin();
    // slow push + hook kick
    const kick = t >= EV.hook ? 0.025 * Math.exp(-(t - EV.hook) * 5) : 0;
    const z = 1 + 0.06 * E.inOutSine(clamp(t / 10)) + kick, shake = (t >= EV.hook && t < EV.hook + 2 / 12) ? (JF % 2 ? 5 : -5) : 0;
    g.translate(960, 520); g.scale(z, z); g.translate(-960 + shake, -520 - 30 * E.inOutSine(inv(EV.launchF, EV.hook + 0.5, t)) * 0);
    g.drawImage(UP, 0, 0, UP.width, (HZ + 14) * K, 0, 0, 1920, HZ + 14);
    const bx = boat(g, t, Lt);
    reflection(t, bx); boat(g, t, Lt);
    // global wash of firework light on the river
    g.globalCompositeOperation = 'lighter'; g.fillStyle = rgb(Lt.col, 0.08 * Lt.L); g.fillRect(0, HZ, 1920, 600); g.globalCompositeOperation = 'source-over';
    g.setTransform(K, 0, 0, K, 0, 0);
    const zf = 1 + 0.1 * E.inOutSine(clamp(t / 10)) + kick * 1.5; // foreground moves more (parallax)
    g.translate(960, 540); g.scale(zf, zf); g.translate(-960 + shake * 1.5, -540);
    foreground(g, t, Lt);
    g.setTransform(K, 0, 0, K, 0, 0);
    // gouache texture + vignette
    g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.35; g.drawImage(TEX, 0, 0, 1920, 1080); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    const vg = g.createRadialGradient(960, 540, 520, 960, 540, 1180); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,6,25,.5)'); g.fillStyle = vg; g.fillRect(0, 0, 1920, 1080);
  },
});
