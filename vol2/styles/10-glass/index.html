<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>10 弥散渐变 玻璃拟态 · Glass Cards</title>
<script src="../../lib/core.js"></script><script src="../../lib/gl.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 10 弥散渐变 · 玻璃拟态 · 卡片组 =====
   A living mesh gradient. A drop of liquid glass appears, stretches into a card, then splits into three cards
   that fan out on the beat (the hook). Each card is a rounded-rect SDF that refracts and frosts what is behind it —
   including the cards behind it — with edge dispersion, a rim light, a moving specular sweep and a soft shadow. */
const { E, clamp, inv, lerp, spring } = Reel;
const stage = Reel.makeStage('#0d0b1f');
const C = Reel.cfg({ title: '液态玻璃', en: 'LIQUID GLASS · 通透，是一种质感', brand: 'XIAOXIONG', num: '6203  ••••  ••••  2026', name: 'XIAO XIONG' });
const W = Math.round(1920 * Reel.RS), H = Math.round(1080 * Reel.RS);
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px'; stage.appendChild(cv);
const G = Reel.GL(cv);
const prog = G.program(`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform vec2 uRes; uniform float uT; uniform vec2 uJit;
uniform vec4 uC[3]; uniform vec4 uD[3]; uniform float uSweep;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 bg(vec2 p){
  vec3 c = vec3(.05,.04,.12);
  float t = uT;
  vec2 b1 = vec2(760. + 260.*sin(t*.5), 420. + 160.*cos(t*.4));
  vec2 b2 = vec2(1250. + 220.*cos(t*.45 + 1.), 640. + 180.*sin(t*.55));
  vec2 b3 = vec2(980. + 340.*sin(t*.33 + 2.), 300. + 120.*sin(t*.6 + 1.));
  vec2 b4 = vec2(560. + 200.*cos(t*.4 + 3.), 820. + 120.*sin(t*.5 + 2.));
  vec2 b5 = vec2(1500. + 160.*sin(t*.38 + 4.), 220. + 140.*cos(t*.44));
  c += vec3(1.,.28,.62) * exp(-dot(p-b1,p-b1)/(2.*260.*260.)) * 1.0;
  c += vec3(1.,.55,.18) * exp(-dot(p-b2,p-b2)/(2.*240.*240.)) * .95;
  c += vec3(.22,.75,1.) * exp(-dot(p-b3,p-b3)/(2.*230.*230.)) * .85;
  c += vec3(.45,.3,1.) * exp(-dot(p-b4,p-b4)/(2.*300.*300.)) * .9;
  c += vec3(.7,1.,.5) * exp(-dot(p-b5,p-b5)/(2.*180.*180.)) * .45;
  return c;
}
float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
vec2 local(vec2 p, int i){ vec2 q = p - uC[i].xy; float a = -uD[i].x; return mat2(cos(a), sin(a), -sin(a), cos(a)) * q; }
float cardD(vec2 p, int i){ return sdRR(local(p,i), uC[i].zw, uD[i].y); }
vec2 cardN(vec2 p, int i){ vec2 e = vec2(1.,0.); return normalize(vec2(cardD(p+e.xy,i)-cardD(p-e.xy,i), cardD(p+e.yx,i)-cardD(p-e.yx,i)) + 1e-5); }
void main(){
  vec2 fc = gl_FragCoord.xy + uJit;
  vec2 p = vec2(fc.x, uRes.y - fc.y) / uRes * vec2(1920., 1080.);
  // shadows of cards on the backdrop
  float shade = 1.;
  for (int i = 0; i < 3; i++){ if (uD[i].z < .01) continue; float ds = cardD(p - vec2(0., 34.), i); shade *= 1. - .38 * uD[i].z * smoothstep(60., -30., ds); }
  // refraction through the stack (back to front)
  vec2 off = vec2(0.); float frost = 0.; float disp = 0.; vec3 tint = vec3(1.); float rim = 0.; float spec = 0.; float inside = 0.;
  for (int i = 0; i < 3; i++){
    if (uD[i].z < .01) continue;
    float d = cardD(p, i);
    if (d < 0.) {
      vec2 n = cardN(p, i);
      float edge = 1. - smoothstep(0., 46., -d);
      off += -n * 70. * edge * edge * uD[i].z;
      off += (p - uC[i].xy) * -.06 * uD[i].z;                       // slight lens magnification
      frost = max(frost, uD[i].w * uD[i].z); disp += edge * uD[i].z;
      tint *= mix(vec3(1.), vec3(1.04,1.03,1.08), uD[i].z);
      vec2 lq = local(p, i);
      float sw = exp(-pow((lq.x + lq.y * .6 - uSweep * uC[i].z * 2.4) / 60., 2.));
      spec = max(spec, sw * .35 * uD[i].z);
      inside = max(inside, uD[i].z);
      rim = max(rim, smoothstep(2.2, 0., -d) * (.45 + .55 * max(0., dot(n, normalize(vec2(-.6,-.8))))) * uD[i].z);
      rim = max(rim, smoothstep(1.6, 0., abs(d + 6.)) * .18 * uD[i].z);
    } else {
      rim = max(rim, smoothstep(1.4, 0., d) * .5 * uD[i].z);
    }
  }
  vec3 col;
  if (inside > 0.) {
    vec3 acc = vec3(0.); float R = 22. * frost;
    for (int k = 0; k < 12; k++){ float a = float(k) * 2.39996 + hash12(fc) * 6.28; float r = sqrt((float(k) + .5) / 12.) * R; acc += bg(p + off + vec2(cos(a), sin(a)) * r); }
    acc /= 12.;
    // dispersion at the edges
    vec3 cd = vec3(bg(p + off * (1. + .12 * disp)).r, acc.g, bg(p + off * (1. - .12 * disp)).b);
    col = mix(acc, vec3(mix(acc.r, cd.r, min(disp, 1.)), acc.g, mix(acc.b, cd.b, min(disp, 1.))), .8);
    col = col * tint * 1.08 + vec3(.06,.06,.09) * inside;                 // milky glass body
    col *= mix(1., shade, .35);
  } else {
    col = bg(p) * shade;
  }
  col += vec3(1.) * rim * .9 + vec3(1.,.98,.95) * spec;
  // film: vignette + grain
  vec2 d = uv - .5; col *= 1. - .35 * smoothstep(.25, .9, length(d * vec2(1.2, 1.)));
  col = col / (1. + col * .25);
  col = pow(col, vec3(.95));
  col += (hash12(fc + uT * 60.) - .5) * .035;
  o = vec4(col, 1.);
}`);
const ov = Reel.canvas2d(stage); const g = ov.ctx;
// card choreography: [cx, cy, hw, hh], [rot, radius, alpha, frost]
function cards(t) {
  const out = [];
  const born = spring(t - 0.2, { k: 120, c: 12 });
  const grow = E.inOutCubic(inv(1.4, 2.6, t));
  const split = spring(t - 4.0, { k: 150, c: 13 });
  const sway = (k) => 0.03 * Math.sin(t * 0.9 + k);
  const fan = [[-0.13, -575, 50], [0.0, 0, -20], [0.13, 575, 50]];
  for (let i = 0; i < 3; i++) {
    const hw = lerp(70, 265, grow) * born, hh = lerp(70, 168, grow) * born, r = lerp(70, 34, grow) * born;
    const [fr, fx, fy] = fan[i];
    const cx = 960 + fx * split + (i - 1) * 12 * grow, cy = 540 + fy * split - 30 * E.inOutSine(inv(6, 9, t));
    const rot = (fr * split + sway(i) * split) + (i - 1) * 0.04 * grow * (1 - split) - 0.08 * grow * (1 - split);
    const a = i === 1 ? 1 : clamp(grow * 2 - 0.6 + split);
    out.push([cx, cy, hw, hh, rot, r, i === 1 ? born > 0.01 ? 1 : 0 : (t > 1.8 ? a : 0), i === 1 ? 0.85 : 1.0]);
  }
  // draw order back-to-front: sides first, middle on top
  return [out[0], out[2], out[1]];
}
Reel.scene({
  duration: 10, fps: 30,
  fonts: ['800 30px Inter', '600 22px Inter', '900 76px "Noto Sans CJK SC"', '500 18px Inter'],
  cues: [{ t: 0.15, sfx: 'swell', gain: 0.5 }, { t: 0.25, sfx: 'blob', gain: 0.8 }, { t: 1.4, sfx: 'stretch', gain: 0.7 }, { t: 3.5, sfx: 'riser_short', gain: 0.4 },
    { t: 4.0, sfx: 'whoosh', gain: 0.7 }, { t: 4.08, sfx: 'glass', gain: 0.9 }, { t: 4.3, sfx: 'sparkle', gain: 0.5 }, { t: 6.0, sfx: 'chime', gain: 0.5 }, { t: 7.0, sfx: 'glass', gain: 0.5 }],
  render(t) {
    const OPEN_T0 = 0.6; if (t < 2) t = OPEN_T0 + (2 - OPEN_T0) * t / 2; // no blank opening: frame 0 starts mid-intro

    const cs = cards(t);
    const C4 = new Float32Array(12), D4 = new Float32Array(12);
    cs.forEach((c, i) => { C4.set([c[0], c[1], c[2], c[3]], i * 4); D4.set([c[4], c[5], c[6], c[7]], i * 4); });
    const jit = Reel.jit || [0, 0];
    prog.use().set('uRes', [W, H]).set('uT', t).set('uJit', [jit[0], -jit[1]]).set('uC', C4).set('uD', D4).set('uSweep', ((t * 0.35) % 1.4) - 0.6);
    // uniform arrays need explicit upload
    const gl = G.gl; gl.uniform4fv(gl.getUniformLocation(prog.pr, 'uC'), C4); gl.uniform4fv(gl.getUniformLocation(prog.pr, 'uD'), D4);
    prog.draw(null);
    // card faces (2D overlay, same transforms)
    ov.begin(); g.clearRect(0, 0, 1920, 1080);
    const lbl = ['CREATOR', 'XIAOXIONG', 'STUDIO'];
    cs.forEach((c, k) => {
      const [cx, cy, hw, hh, rot, r, a] = c; if (a < 0.05 || hw < 200) return;
      const tA = a * E.outCubic(inv(2.4, 3.0, t)) * (k === 2 ? 1 : clamp(spring(t - 4.0, { k: 150, c: 13 }) * 1.5 - 0.3));
      g.save(); g.translate(cx, cy); g.rotate(rot); g.globalAlpha = tA;
      g.fillStyle = 'rgba(255,255,255,.95)'; g.font = '800 30px Inter'; g.textBaseline = 'alphabetic'; g.letterSpacing = '6px';
      g.fillText(k === 2 ? lbl[1] : k === 0 ? lbl[0] : lbl[2], -hw + 44, -hh + 64);
      // chip
      const cg = g.createLinearGradient(-hw + 44, -20, -hw + 124, 40); cg.addColorStop(0, 'rgba(255,230,170,.9)'); cg.addColorStop(1, 'rgba(200,160,90,.9)');
      g.fillStyle = cg; g.beginPath(); g.roundRect(-hw + 44, -34, 76, 58, 10); g.fill(); g.strokeStyle = 'rgba(120,90,40,.5)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-hw + 44, -5); g.lineTo(-hw + 120, -5); g.moveTo(-hw + 82, -34); g.lineTo(-hw + 82, 24); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '600 26px Inter'; g.letterSpacing = '3px'; g.font = '600 23px Inter'; g.fillText(C.num, -hw + 44, hh - 76);
      g.font = '500 18px Inter'; g.fillStyle = 'rgba(255,255,255,.7)'; g.letterSpacing = '4px'; g.fillText(C.name, -hw + 44, hh - 38); g.textAlign = 'right'; g.fillText('10/30', hw - 44, hh - 38);
      // contactless glyph
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3; for (let q = 0; q < 3; q++) { g.beginPath(); g.arc(hw - 70, -hh + 54, 10 + q * 9, -0.8, 0.8); g.stroke(); }
      g.restore();
    });
    const ta = E.outCubic(inv(6.2, 6.9, t));
    g.save(); g.globalAlpha = ta; g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '900 120px "Noto Sans CJK SC"'; g.letterSpacing = '10px'; g.fillText(C.title, 960, 930 + (1 - ta) * 20);
    g.font = '500 26px "Noto Sans CJK SC"'; g.letterSpacing = '10px'; g.fillStyle = 'rgba(255,255,255,.75)'; g.fillText(C.en, 960, 1000); g.restore();
    g.save(); g.globalAlpha = E.outCubic(inv(0.3, 1.0, t)) * 0.6; g.font = '600 18px Inter'; g.letterSpacing = '8px'; g.fillStyle = '#fff'; g.fillText(C.brand, 80, 90); g.restore();
  },
});
Reel.ownJitter = true;
</script></body></html>
