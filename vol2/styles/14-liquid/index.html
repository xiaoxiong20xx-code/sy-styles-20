<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>14 液态流动 · Marble Pour</title>
<script src="../../lib/core.js"></script><script src="../../lib/gl.js"></script><script src="../../lib/rm.js"></script>
<style>
  #cap{position:absolute;left:0;right:0;top:420px;text-align:center;color:#fffaf0;font-family:'Noto Serif CJK SC';text-shadow:0 0 50px rgba(5,10,30,.75),0 6px 30px rgba(0,0,0,.5)}
  #cap .a{font-weight:900;font-size:150px;letter-spacing:.3em;padding-left:.3em;line-height:1}
  #cap .b{font:600 30px Inter;letter-spacing:.8em;padding-left:.8em;margin-top:28px;opacity:.85}
</style>
</head><body><div id="stage"></div>
<script>
/* ===== 14 液态流动 · 流体大理石 =====
   Acrylic paint poured on a tilting board, seen from directly above. Domain-warped noise advects five pigments
   into marbled bands with lacing cells; the surface is a height field lit like wet paint (clear specular from a softbox).
   At the hook a heavy drop lands in the centre and pushes the whole pour outward in rings. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#0c1426');
Reel.ownJitter = true;
const C = Reel.cfg({ a: '流动', b: 'LIQUID MOTION' });
const W = Math.round(1920 * Reel.RS), H = Math.round(1080 * Reel.RS);
const cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H; cvs.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px'; stage.appendChild(cvs);
const G = Reel.GL(cvs);
const SRC = {
  scene: `
vec3 pal(float x){
  x = fract(x);
  vec3 c0 = vec3(.03,.07,.22), c1 = vec3(0.,.42,.52), c2 = vec3(1.,.7,.16), c3 = vec3(.93,.28,.3), c4 = vec3(.97,.93,.85);
  float s = x * 5.;
  vec3 a = s < 1. ? mix(c0, c1, smoothstep(.42,.58,s)) : s < 2. ? mix(c1, c4, smoothstep(.42,.58,s-1.)) : s < 3. ? mix(c4, c2, smoothstep(.42,.58,s-2.)) : s < 4. ? mix(c2, c3, smoothstep(.42,.58,s-3.)) : mix(c3, c0, smoothstep(.42,.58,s-4.));
  return a;
}
vec2 warpP(vec2 p){
  float t = uFlow;
  // drop: radial push
  float r = length(p); float R = uDrop * 2.6;
  p -= normalize(p + 1e-4) * 1.1 * uDrop * exp(-pow((r - R) / .55, 2.)) * smoothstep(0., .1, uDrop);
  p *= 1. - .35 * uDrop * exp(-r * r * 1.2);
  vec2 q = vec2(fbm2(p * .55 + vec2(0., t * .12)), fbm2(p * .55 + vec2(5.2, 1.3) - vec2(t * .09, 0.)));
  vec2 s = vec2(fbm2(p * .7 + 2.4 * q + vec2(1.7, 9.2) + t * .07), fbm2(p * .7 + 2.4 * q + vec2(8.3, 2.8) - t * .06));
  return p + 1.9 * s;
}
float field(vec2 p){ vec2 w = warpP(p); return fbm2(w * .6) * 3.2 + w.x * .2 + w.y * .08; }
vec3 render(vec2 fc){
  vec2 uv = (2. * fc - uRes) / uRes.y;
  float cr = cos(uRot), sr = sin(uRot);
  vec2 p = mat2(cr, sr, -sr, cr) * uv * uZoom;
  float e = 2.2 / uRes.y * uZoom;
  float f = field(p), fx = field(p + vec2(e, 0.)), fy = field(p + vec2(0., e));
  vec3 base = pal(f);
  // lacing cells: thin white veins where the field folds
  float vein = smoothstep(.482, .497, abs(fract(f * 1.7) - .5));
  base = mix(base, vec3(.9,.85,.75), vein * .5);
  // height-field normal (paint ridges follow the bands)
  float h = sin(f * 6.2832 * 2.5) * .5 + .5;
  vec3 n = normalize(vec3(-(fx - f) / e * .006, -(fy - f) / e * .006, 1.));
  vec3 L = normalize(vec3(-.4, .5, .8)), V = vec3(0., 0., 1.);
  float dif = .75 + .25 * dot(n, L);
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(n, H), 0.), 90.) * .9;
  // softbox reflection streak
  vec3 Rf = reflect(-V, n);
  float box = smoothstep(.05, .0, abs(Rf.x + .18) - .12) * smoothstep(.05, .0, abs(Rf.y - .22) - .2);
  vec3 col = base * (.9 + .15 * dot(n, L)) + vec3(1.) * (spec * .6 + box * .12);
  // fresh wet sheen near the drop
  col += vec3(1.) * .6 * (1. - uDrop) * uDrop * exp(-pow((length(p) - uDrop * 2.6) / .12, 2.)) * smoothstep(.0,.1,uDrop);
  return col;
}`,
};
const prog = G.program(`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform vec2 uRes; uniform float uTime; uniform vec2 uJit; uniform float uDrop, uZoom, uRot, uFlow;
` + Reel.RM_COMMON + SRC.scene + `
void main(){ vec3 c = render(gl_FragCoord.xy + uJit); vec2 d = uv - .5; c *= 1. - .45 * smoothstep(.3, .95, length(d * vec2(1.2, 1.)));
  c += (hash12(gl_FragCoord.xy + uTime * 50.) - .5) * .03; o = vec4(clamp(c, 0., 1.), 1.); }`);
const cap = document.createElement('div'); cap.id = 'cap'; cap.innerHTML = `<div class="a">${C.a}</div><div class="b">${C.b}</div>`; stage.appendChild(cap);
Reel.scene({
  duration: 10, fps: 30,
  fonts: ['900 150px "Noto Serif CJK SC"', '500 22px Inter'],
  cues: [{ t: 0.1, sfx: 'swell', gain: 0.6 }, { t: 1.2, sfx: 'drip', gain: 0.4 }, { t: 3.9, sfx: 'riser_short', gain: 0.4 }, { t: 4.5, sfx: 'splash', gain: 1.0 },
    { t: 4.52, sfx: 'impact_soft', gain: 0.6 }, { t: 5.2, sfx: 'blob', gain: 0.5 }, { t: 7.0, sfx: 'chime', gain: 0.6 }],
  render(t) {
    const drop = t < 4.5 ? 0 : E.outCubic(clamp((t - 4.5) / 3.2));
    const flow = t * 1.0 + 1.2 * drop;
    const jit = Reel.jit || [0, 0];
    prog.use().set('uRes', [W, H]).set('uTime', t).set('uJit', [jit[0], -jit[1]]).set('uDrop', drop).set('uZoom', lerp(1.25, 1.0, E.inOutSine(clamp(t / 10)))).set('uRot', 0.25 * E.inOutSine(clamp(t / 10))).set('uFlow', flow).draw(null);
    const a = E.outCubic(inv(6.3, 6.9, t)); cap.style.opacity = a; cap.style.transform = `translateY(${(1 - a) * 20}px) scale(${1 + (1 - a) * 0.04})`;
  },
});
</script></body></html>
