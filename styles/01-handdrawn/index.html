<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>01 逐帧手绘 · Frame by Frame</title>
<script src="../../lib/core.js"></script><script src="../../lib/gl.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 01 逐帧手绘 · FRAME BY FRAME =====
   A storybook cottage painted in pencil and watercolour, redrawn every frame (on twos, 12 drawings/s).
   Blue construction lines are sketched first, graphite line art follows, then the washes flood in and
   dry with darker edges; shadows are glazed on top and hatched. Then the camera moves: the painting is
   a 3D world. Smoke curls, birds pass, a paper plane loops the tree, and the light turns to golden hour.
   Pipeline: raymarched G-buffer (normal/depth, material id, light/AO/shadow) -> stylisation pass
   (boiling edge detection, wash layers, granulation, paper tooth) + a 2D overlay for hand strokes. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#f4efe4');
Reel.ownJitter = true;
const C = Reel.cfg({ cap: '每一帧，都是一张画', capEn: 'FRAME BY FRAME · 12 DRAWINGS PER SECOND' });

const RS = Reel.RS;
const W = Math.round(1920 * RS), H = Math.round(1080 * RS);
const K = W / 1216;                      // device px per design px (design space = 1216 x 684)
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px';
stage.appendChild(cv);
const G = Reel.GL(cv);
const gl = G.gl;
gl.getExtension('EXT_color_buffer_float');

function mkTex(w, h, filter, half) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  if (half) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
// G-buffer: 0 normal+depth (linear), 1 id (nearest), 2 light/ao/shadow (linear)
const gb = { w: W, h: H, fb: gl.createFramebuffer(), texs: [mkTex(W, H, gl.LINEAR, true), mkTex(W, H, gl.NEAREST, true), mkTex(W, H, gl.LINEAR, true)] };
gl.bindFramebuffer(gl.FRAMEBUFFER, gb.fb);
gb.texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);
// 2D overlay (hand strokes): R = blue construction pencil, G = graphite strokes, B = smoke wash
const ov = document.createElement('canvas'); ov.width = W; ov.height = H;
const ox = ov.getContext('2d');
const ovTex = mkTex(W, H, gl.LINEAR, false);

const NOISE = `
float hash11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y), f.z); }
float vnoise2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm2(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise2(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s/.9375; }
float fbm3(vec3 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.07+vec3(1.7,9.2,3.1); a*=.5; } return s/.875; }
#define HB 1.36
float terrainH(vec2 p){
  float h = 1.3*exp(-dot(p-vec2(.4,-.8), p-vec2(.4,-.8))*.032);
  h += 2.3*exp(-dot((p-vec2(-15.,-20.))*vec2(.55,1.), (p-vec2(-15.,-20.))*vec2(.55,1.))*.006);
  h += 2.9*exp(-dot((p-vec2(17.,-30.))*vec2(.5,1.), (p-vec2(17.,-30.))*vec2(.5,1.))*.005);
  h += .8*exp(-dot(p-vec2(-7.5,4.5), p-vec2(-7.5,4.5))*.03);
  h += .16*sin(p.x*.43+.3)*sin(p.y*.37+1.1);
  float pad = smoothstep(2.5, 1.35, length(p*vec2(.78,1.)));
  return mix(h, HB, pad);
}
float pathX(float z){ return .35 + 1.05*sin((z-.9)*.33) + .08*(z-.9); }
`;

/* ---------------- pass 1: raymarched G-buffer ---------------- */
const gbuf = G.program(`#version 300 es
precision highp float; precision highp int;
in vec2 uv;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1; layout(location=2) out vec4 o2;
uniform vec2 uRes; uniform vec3 uRo, uCu, uCv, uCw; uniform float uFl;
uniform vec3 uSun; uniform float uSway, uT;
uniform vec3 uPlP, uPlX, uPlY, uPlZ; uniform float uPlOn;
${NOISE}
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdTri(vec2 p, vec2 p0, vec2 p1, vec2 p2){
  vec2 e0=p1-p0, e1=p2-p1, e2=p0-p2, v0=p-p0, v1=p-p1, v2=p-p2;
  vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.,1.);
  vec2 pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.,1.);
  vec2 pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.,1.);
  float s=sign(e0.x*e2.y-e0.y*e2.x);
  vec2 d=min(min(vec2(dot(pq0,pq0),s*(v0.x*e0.y-v0.y*e0.x)), vec2(dot(pq1,pq1),s*(v1.x*e1.y-v1.y*e1.x))), vec2(dot(pq2,pq2),s*(v2.x*e2.y-v2.y*e2.x)));
  return -sqrt(d.x)*sign(d.y);
}
float ext(float d2, float z, float h){ vec2 w=vec2(d2, abs(z)-h); return min(max(w.x,w.y),0.)+length(max(w,0.)); }
float sdPine(vec3 q, float h, float r, float sd){
  float rho = length(q.xz), an = atan(q.z, q.x);
  float d = 1e3;
  for (int i=0;i<4;i++){                       // four stacked, ragged tiers
    float fi = float(i); float y0 = h*(.14+.2*fi), hh = h*(.42-.06*fi), rr = r*(1.-.2*fi);
    rr *= 1. + .16*sin(an*7. + fi*2.1 + sd) + .08*sin(an*13. + sd*3.);
    vec2 w = vec2(rho, q.y - y0 + .12*rr*(.5+.5*sin(an*5.+sd)));
    float dc = max((w.x*hh + w.y*rr - rr*hh)/sqrt(hh*hh+rr*rr), -w.y);
    d = min(d, dc);
  }
  return min(d*.8, max(rho-.06*r, max(q.y-h*.3, -q.y)));
}
const vec3 TREE = vec3(2.45, 0., -1.25);
vec2 map(vec3 p){
  vec2 r = vec2((p.y - terrainH(p.xz))*.62, 1.);
  // ---- cottage ----
  vec3 q = p - vec3(0., HB, 0.);
  q.y += .05*(1. - q.x*q.x/1.95)*smoothstep(1.3, 2.7, q.y);     // the ridge sags a little
  q.x -= .018*q.y;                                               // and the whole cottage leans
  float bh = sdBox(q - vec3(0.,1.6,0.), vec3(1.7,1.75,1.45));
  if (bh < r.x){
    float rp = (q.y + 1.111*abs(q.z) - 2.5)/1.4948;
    float body = max(sdBox(q - vec3(0.,1.15,0.), vec3(1.2,1.45,.9)), rp);
    vec3 dq = q - vec3(.38,.56,.9);
    vec3 wq = q - vec3(-.55,.95,.9);
    vec3 sq = q - vec3(1.2,.92,.12);
    vec3 aq = q - vec3(1.2,1.88,0.);
    float holes = min(min(sdBox(dq, vec3(.25,.56,.06)), sdBox(wq, vec3(.27,.25,.06))), min(sdBox(sq, vec3(.06,.25,.23)), max(length(aq.yz)-.19, abs(aq.x)-.06)));
    body = max(body, -holes);
    if (body < r.x) r = vec2(body, 3.);
    float door = sdBox(dq - vec3(0.,0.,-.05), vec3(.25,.56,.02));
    door = min(door, min(sdBox(wq - vec3(-.37,0.,.075), vec3(.085,.26,.015)), sdBox(wq - vec3(.37,0.,.075), vec3(.085,.26,.015))));   // shutters
    if (door < r.x) r = vec2(door, 6.);
    float glass = min(min(sdBox(wq - vec3(0.,0.,-.04), vec3(.27,.25,.015)), sdBox(sq - vec3(-.04,0.,0.), vec3(.015,.25,.23))), max(length(aq.yz)-.19, abs(aq.x+.04)-.015));
    if (glass < r.x) r = vec2(glass, 7.);
    float mu = min(sdBox(wq - vec3(0.,0.,-.02), vec3(.022,.25,.022)), sdBox(wq - vec3(0.,0.,-.02), vec3(.27,.022,.022)));
    mu = min(mu, min(sdBox(sq - vec3(-.02,0.,0.), vec3(.022,.25,.022)), sdBox(sq - vec3(-.02,0.,0.), vec3(.022,.022,.23))));
    mu = min(mu, sdBox(wq - vec3(0.,-.29,.05), vec3(.34,.03,.08)));                   // sill
    mu = min(mu, sdBox(dq - vec3(0.,.6,.04), vec3(.31,.03,.06)));                      // lintel
    mu = min(mu, max(abs(length(aq.yz)-.2)-.025, abs(aq.x-.01)-.03));                  // round frame
    vec3 lq = q - vec3(.82,1.22,.98);
    mu = min(mu, min(sdBox(lq - vec3(0.,.11,0.), vec3(.075,.018,.075)), sdBox(lq - vec3(0.,.15,-.05), vec3(.012,.012,.06))));   // lantern cap + bracket
    float lan = sdBox(lq, vec3(.05,.09,.05));
    if (lan < r.x) r = vec2(lan, 7.);
    if (mu < r.x) r = vec2(mu, 8.);
    float roof = max(abs(rp - .065) - .065, max(abs(q.z) - 1.12, abs(q.x) - 1.38));
    if (roof < r.x) r = vec2(roof, 4.);
    vec3 cq = q - vec3(-.62, 2.4, -.36); cq.x -= .06*cq.y;
    float ch = min(sdBox(cq, vec3(.17,.55,.17)), sdBox(cq - vec3(0.,.56,0.), vec3(.21,.045,.21)));
    if (ch < r.x) r = vec2(ch, 5.);
  }
  // ---- big tree ----
  vec3 tp = p - TREE; tp.y -= terrainH(TREE.xz);
  float bt = length((tp - vec3(0.,2.5,0.))*vec3(1.,.85,1.)) - 2.1;
  if (bt < r.x){
    float sw = uSway * smoothstep(.8, 3.6, tp.y);
    tp.x -= sw; tp.z -= sw*.4;
    float tr = sdCapsule(tp, vec3(0.), vec3(.1,2.1,-.06), .15 - .05*clamp(tp.y/2.1,0.,1.));
    tr = min(tr, sdCapsule(tp, vec3(.05,1.5,-.03), vec3(.62,2.3,.15), .06));
    tr = min(tr, sdCapsule(tp, vec3(.06,1.7,-.04), vec3(-.55,2.45,-.2), .055));
    if (tr < r.x) r = vec2(tr, 10.);
    float c = length(tp - vec3(0.,2.95,0.)) - .92;
    c = smin(c, length(tp - vec3(-.78,2.5,.3)) - .66, .32);
    c = smin(c, length(tp - vec3(.78,2.55,.25)) - .68, .32);
    c = smin(c, length(tp - vec3(.1,3.55,-.05)) - .66, .32);
    c = smin(c, length(tp - vec3(-.55,3.25,-.45)) - .62, .32);
    c = smin(c, length(tp - vec3(.68,3.2,-.42)) - .6, .32);
    c = smin(c, length(tp - vec3(.02,2.35,.66)) - .58, .32);
    c = smin(c, length(tp - vec3(-.32,2.25,-.62)) - .55, .32);
    c = smin(c, length(tp - vec3(-.95,3.0,.05)) - .48, .32);
    c = smin(c, length(tp - vec3(1.0,2.95,.1)) - .5, .32);
    if (c < r.x + .3){
      c += (fbm3(tp*1.7 + 3.) - .5)*.34 + (vnoise(tp*5.2) - .5)*.07;
      c *= .62;
    }
    if (c < r.x) r = vec2(c, 9.);
  }
  // ---- bushes ----
  {
    vec3 b1 = p - vec3(-1.42, HB+.18, 1.02), b2 = p - vec3(1.42, HB+.12, 1.05), b3 = p - vec3(-.62, terrainH(vec2(-.62,3.3))+.12, 3.3);
    float bb = min(min(length(b1)-.48, length(b2)-.42), length(b3)-.42);
    if (bb < r.x + .3){
      bb = min(min(length(b1*vec3(1.,1.25,1.))-.38, length(b2*vec3(1.,1.3,1.))-.32), length(b3*vec3(1.,1.3,1.))-.32);
      bb += (fbm3(p*4.2) - .5)*.2; bb *= .7;
      if (bb < r.x) r = vec2(bb, 12.);
    }
  }
  // ---- picket fence along the path ----
  {
    const vec2 FA = vec2(1.05, 1.35); const vec2 FD = vec2(.30, .954);   // start, unit direction
    vec2 rel = p.xz - FA; float s = dot(rel, FD), side = rel.x*FD.y - rel.y*FD.x;
    if (s > -.3 && s < 3.9 && abs(side) < .3){
      float gy = terrainH(FA + FD*clamp(s,0.,3.6));
      vec3 lq = vec3(side, p.y - gy, s);
      float cs = clamp(floor(s/.24 + .5), 0., 15.);
      vec3 pq = lq - vec3(0., 0., cs*.24);
      float pk = sdBox(pq - vec3(0.,.3,0.), vec3(.018,.3,.045));
      pk = max(pk, (pq.y + abs(pq.z)*1.2 - .64)*.7);
      float rail = min(sdBox(lq - vec3(-.03,.17,1.8), vec3(.012,.025,1.82)), sdBox(lq - vec3(-.03,.45,1.8), vec3(.012,.025,1.82)));
      float f = min(pk, rail);
      if (f < r.x) r = vec2(f, 11.);
    }
  }
  // ---- pines on the far-left hill ----
  {
    float bp = sdBox(p - vec3(-11.,3.,-16.), vec3(6.5,4.,6.));
    if (bp < r.x){
      for (int i=0;i<7;i++){
        float fi = float(i);
        vec2 c = vec2(-15.5 + fi*1.45 + hash11(fi*3.1)*.6, -18.5 + hash11(fi*7.7)*5.);
        float hgt = 2.4 + hash11(fi*1.3)*1.8;
        vec3 pq = p - vec3(c.x, terrainH(c) - .1, c.y);
        float d = sdPine(pq, hgt, .75 + .15*hash11(fi*9.1), fi*1.7);
        if (d < r.x) r = vec2(d, 14.);
      }
    }
  }
  // ---- paper plane ----
  if (uPlOn > .5){
    vec3 d = p - uPlP;
    if (length(d) < r.x + .45){
      vec3 l = vec3(dot(d,uPlX), dot(d,uPlY), dot(d,uPlZ));
      vec3 m = vec3(abs(l.x), l.y, l.z);
      float a = .22; vec2 cs = vec2(cos(a), sin(a));
      float u = dot(m.xy, cs), w = dot(m.xy, vec2(-cs.y, cs.x));
      float wing = ext(sdTri(vec2(u, m.z), vec2(0.,.33), vec2(0.,-.3), vec2(.26,-.3)), w, .004);
      float keel = ext(sdTri(vec2(l.y, l.z), vec2(0.,.3), vec2(0.,-.3), vec2(-.075,-.24)), l.x, .004);
      float pl = min(wing, keel);
      if (pl < r.x) r = vec2(pl, 13.);
    }
  }
  return r;
}
vec3 calcN(vec3 p, float t){
  float e = .0012 + .0004*t; vec2 k = vec2(1.,-1.);
  return normalize(k.xyy*map(p+k.xyy*e).x + k.yyx*map(p+k.yyx*e).x + k.yxy*map(p+k.yxy*e).x + k.xxx*map(p+k.xxx*e).x);
}
float softShadow(vec3 ro, vec3 rd){
  float res = 1., t = .03;
  for (int i=0;i<48;i++){
    float h = map(ro + rd*t).x;
    res = min(res, 9.*h/t);
    t += clamp(h, .03, .6);
    if (res < .002 || t > 22.) break;
  }
  return clamp(res, 0., 1.);
}
float calcAO(vec3 p, vec3 n){
  float o = 0., s = 1.;
  for (int i=1;i<=5;i++){ float h = .04 + .12*float(i); o += (h - map(p + n*h).x)*s; s *= .7; }
  return clamp(1. - 1.6*o, 0., 1.);
}
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 q = (fc - .5*uRes)/uRes.y;
  vec3 rd = normalize(uCu*q.x + uCv*q.y + uCw*uFl);
  float t = .2; vec2 h = vec2(1e3, 0.); bool hit = false;
  for (int i=0;i<200;i++){
    vec3 p = uRo + rd*t; h = map(p);
    if (h.x < .0007*t){ hit = true; break; }
    t += h.x;
    if (t > 110.) break;
  }
  if (!hit){ o0 = vec4(0.,0.,0.,300.); o1 = vec4(0.,0.,0.,1.); o2 = vec4(1.,1.,1.,1.); return; }
  vec3 p = uRo + rd*t;
  vec3 n = calcN(p, t);
  float id = h.y;
  if (id < 1.5){
    float pw = .3 + .045*max(p.z-.9, 0.);
    float pm = smoothstep(pw, pw-.05, abs(p.x - pathX(p.z))) * smoothstep(.8, 1.05, p.z);
    if (pm > .5) id = 2.;
  }
  float ndl = dot(n, uSun);
  float sh = ndl > 0. ? softShadow(p + n*.01, uSun) : 0.;
  float ao = calcAO(p, n);
  o0 = vec4(n, t);
  o1 = vec4(id, 0., 0., 1.);
  o2 = vec4(max(ndl,0.)*sh, ao, sh, ndl);
}`.replace('vec2 map(vec3 p){', `float smin(float a, float b, float k){ float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*k*.25; }
vec2 map(vec3 p){`));

/* ---------------- pass 2: pencil + watercolour stylisation ---------------- */
const sty = G.program(`#version 300 es
precision highp float; precision highp int;
in vec2 uv; out vec4 o;
uniform sampler2D g0, g1, g2, ovT;
uniform vec2 uRes; uniform vec3 uRo, uCu, uCv, uCw; uniform float uFl;
uniform float uT, uSeed, uDusk, uK; uniform vec3 uSun;
${NOISE}
struct Px { float id; vec3 n; float t; float L; float ao; float sh; float nd; vec3 rd; vec3 pos; };
vec3 rayDir(vec2 fc){ vec2 q = (fc - .5*uRes)/uRes.y; return normalize(uCu*q.x + uCv*q.y + uCw*uFl); }
float mtn(float az, float base, float amp, float fr, float sd){
  float m = 0., a = .5, f = fr;
  for (int i=0;i<4;i++){ m += a*(1.-abs(vnoise2(vec2(az*f, sd))*2.-1.)); f *= 2.1; a *= .5; }
  return base + amp*m;
}
float skyId(vec3 rd){
  float az = atan(rd.x, -rd.z);
  if (rd.y < mtn(az, -.03, .085, 2.6, 3.)) return 16.;
  if (rd.y < mtn(az, -.02, .15, 1.7, 9.)) return 15.;
  return 0.;
}
Px getPx(vec2 fc){
  Px c;
  vec2 u = fc/uRes;
  vec4 a = texture(g0, u);
  c.id = texture(g1, u).x;
  vec4 b = texture(g2, u);
  c.n = a.xyz; c.t = a.w; c.L = b.x; c.ao = b.y; c.sh = b.z; c.nd = b.w;
  c.rd = rayDir(fc);
  c.pos = uRo + c.rd*c.t;
  if (c.id < .5) c.id = skyId(c.rd);
  return c;
}
float getId(vec2 fc){ float id = texture(g1, fc/uRes).x; if (id < .5) id = skyId(rayDir(fc)); return id; }
vec2 boil(vec2 dc, float sd, float amp){
  vec2 q = dc*.0075 + sd*vec2(17.13, 31.71);
  vec2 b = vec2(vnoise2(q), vnoise2(q + 7.31)) - .5;
  b += (vec2(vnoise2(q*3.3 + 3.), vnoise2(q*3.3 + 9.)) - .5)*.5;
  return b*2.*amp;
}
bool isFol(float id){ return (id > .5 && id < 1.5) || (id > 8.5 && id < 9.5) || (id > 11.5 && id < 12.5) || (id > 13.5 && id < 14.5); }
float creaseW(float id){
  if (id > 2.5 && id < 8.5) return 1.;
  if (id > 10.5 && id < 11.5) return 1.;
  if (id > 12.5 && id < 13.5) return 1.;
  if (id > 8.5 && id < 10.5) return .5;
  return .2;
}
// ---- when each part of the drawing is inked ----
float inkStart(float id, vec3 pos, vec2 dc){
  float x = dc.x/1216.;
  if (id < .5 || id > 14.5) return 1.2 + x*.45;                          // mountains (and their sky side)
  if (id < 2.5) return 1.3 + x*.55;                                      // hills, path
  if (id < 8.5) return 1.55 + (pos.x + 1.4)*.2 + (3. - (pos.y - HB))*.05; // cottage, left to right, top down

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, ov);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    sty.use()
      .set('g0', { tex: gb.texs[0], unit: 0 }).set('g1', { tex: gb.texs[1], unit: 1 }).set('g2', { tex: gb.texs[2], unit: 2 }).set('ovT', { tex: ovTex, unit: 3 })
      .set('uRes', [W, H]).set('uRo', cam.ro).set('uCu', cam.u).set('uCv', cam.v).set('uCw', cam.w).set('uFl', FL)
      .set('uT', t).set('uSeed', (f12 % 97) * 0.731).set('uDusk', dusk).set('uK', 1216 / W).set('uSun', sun);
    gl.enable(gl.SCISSOR_TEST);
    for (let b = 0; b < bands; b++) { gl.scissor(0, b * bh, W, bh); sty.draw(null); gl.finish(); }
    gl.disable(gl.SCISSOR_TEST);
  },
});
