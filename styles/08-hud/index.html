<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>08 赛博朋克 HUD · Cyberpunk HUD</title>
<script src="../../lib/core.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 08 赛博朋克 HUD · CYBERPUNK HUD =====
   A drone flies into a night city captured as a LiDAR point cloud (~50k points, projected and drawn
   additively): a scan wave sweeps out from the drone and lights the city up. Over it, a full flight HUD:
   compass, altitude and speed tapes, radar, scrolling data, and a reticle that acquires and locks a
   flying car. Glitch slices, RGB split, scanlines. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#02060a');
const C = Reel.cfg({ title: '赛博朋克 HUD', titleEn: 'CYBERPUNK INTERFACE', lock: '目标锁定', tgt: 'TGT-07' });
const RS = Reel.RS;
const W = Math.round(1920 * RS), H = Math.round(1080 * RS), K = W / 1920;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px';
stage.appendChild(cv);
const ctx = cv.getContext('2d');
const fx = document.createElement('canvas'); fx.width = W; fx.height = H;
const fctx = fx.getContext('2d');
const h1 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- point-cloud city ---------- */
const PX = [], PY = [], PZ = [], PK = [];   // position + kind (0 building, 1 sign, 2 ground, 3 road light)
function add(x, y, z, k) { PX.push(x); PY.push(y); PZ.push(z); PK.push(k); }
const BLD = [];
for (let zi = 0; zi < 22; zi++) for (let side = -1; side <= 1; side += 2) for (let col = 0; col < 4; col++) {
  const z0 = zi * 34 + h1(zi * 7 + col + side) * 6, x0 = side * (14 + col * 26 + h1(zi + col * 3) * 6);
  const w = 12 + h1(zi * 3 + col) * 12, d = 14 + h1(zi * 5 + col * 2) * 14;
  const hgt = 18 + Math.pow(h1(zi * 11 + col * 7 + side), 1.6) * 120 * (1 - col * 0.12);
  BLD.push([x0 - w / 2, z0, x0 + w / 2, z0 + d, hgt]);
}
for (const [x0, z0, x1, z1, hgt] of BLD) {
  const fl = 3.2;
  // horizontal scan lines at each floor on the four faces
  for (let y = 0; y <= hgt; y += fl) {
    const step = 2.2;
    for (let x = x0; x <= x1; x += step) { add(x, y, z0, 0); add(x, y, z1, 0); }
    for (let z = z0; z <= z1; z += step) { add(x0, y, z, 0); add(x1, y, z, 0); }
  }
  // vertical edges, denser
  for (let y = 0; y <= hgt; y += 0.8) { add(x0, y, z0, 0); add(x1, y, z0, 0); add(x0, y, z1, 0); add(x1, y, z1, 0); }
  // roof outline
  for (let x = x0; x <= x1; x += 0.8) { add(x, hgt, z0, 0); add(x, hgt, z1, 0); }
  for (let z = z0; z <= z1; z += 0.8) { add(x0, hgt, z, 0); add(x1, hgt, z, 0); }
  // neon sign on some facades facing the avenue
  if (h1(x0 * 3 + z0) > 0.55) {
    const fxs = x0 > 0 ? x0 : x1, sy = 8 + h1(z0) * Math.min(40, hgt - 10), sh = 6 + h1(x0) * 10;
    for (let y = sy; y < sy + sh; y += 0.5) for (let z = z0 + 2; z < z0 + 2 + 4; z += 0.5) add(fxs, y, z, 1);
  }
}
// ground grid + avenue lane markings
for (let z = 0; z < 760; z += 2) { for (const x of [-8, -2.6, 2.6, 8]) add(x, 0, z, 2); }
for (let z = 0; z < 760; z += 17) for (let x = -120; x <= 120; x += 2) add(x, 0, z, 2);
const NP = PX.length;
const SIGNC = ['rgba(255,46,136,', 'rgba(255,190,60,', 'rgba(120,255,240,'];

/* ---------- camera flight ---------- */
function camAt(t) {
  const z = -40 + t * 46 + E.inOutSine(clamp((t - 2) / 4)) * 70;
  const x = Math.sin(t * 0.45) * 3;
  const y = 38 - E.inOutSine(clamp((t - 1.5) / 5)) * 16 + Math.sin(t * 1.3) * 0.6;
  const yaw = Math.sin(t * 0.45 + 0.6) * 0.06, pitch = -0.2 + E.inOutSine(clamp((t - 1.5) / 5)) * 0.12, roll = Math.sin(t * 0.45) * 0.05 + (t > 7.6 ? E.inOutSine(clamp((t - 7.6) / 1.2)) * 0.18 : 0);
  return { x, y, z, yaw, pitch, roll };
}
// the flying car being tracked
function tgtAt(t) { return [6 + Math.sin(t * 0.9) * 10, 30 + Math.sin(t * 1.4) * 4, -40 + t * 46 + E.inOutSine(clamp((t - 2) / 4)) * 70 + 120 + Math.sin(t * 0.5) * 20]; }
const F = 1050;
let CAM;
function proj(x, y, z) {
  let dx = x - CAM.x, dy = y - CAM.y, dz = z - CAM.z;
  const cy = Math.cos(CAM.yaw), sy = Math.sin(CAM.yaw);
  let rx = dx * cy - dz * sy, rz = dx * sy + dz * cy;
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  let ry = dy * cp - rz * sp; rz = dy * sp + rz * cp;
  const cr = Math.cos(CAM.roll), sr = Math.sin(CAM.roll);
  const ux = rx * cr - ry * sr, uy = rx * sr + ry * cr;
  return [960 + ux / rz * F, 540 - uy / rz * F, rz];
}

/* ---------- HUD helpers ---------- */
const CY = '#5ff6ff', PINK = '#ff2e88', AMB = '#ffc23d';
const MONO = '"DejaVu Sans Mono", monospace';
function line(x0, y0, x1, y1, col, w = 1.5, a = 1) { ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w * K; ctx.beginPath(); ctx.moveTo(x0 * K, y0 * K); ctx.lineTo(x1 * K, y1 * K); ctx.stroke(); ctx.globalAlpha = 1; }
function txt(s, x, y, size, col, align = 'left', a = 1, font = MONO, weight = 500) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = `${weight} ${size * K}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x * K, y * K); ctx.globalAlpha = 1; }
function corners(x, y, w, h, l, col, wd = 2, a = 1) {
  for (const [sx, sy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
    const cx = x + sx * w, cy = y + sy * h, dx = sx ? -l : l, dy = sy ? -l : l;
    line(cx, cy, cx + dx, cy, col, wd, a); line(cx, cy, cx, cy + dy, col, wd, a);
  }
}

Reel.scene({
  duration: 10, fps: 30,
  fonts: [`500 20px ${MONO}`, '900 80px "Noto Sans CJK SC"', '600 22px Inter'],
  cues: [{ t: 0.1, sfx: 'boot' }, { t: 1.2, sfx: 'whoosh' }, { t: 3.4, sfx: 'beep' }, { t: 4.4, sfx: 'beep' }, { t: 5.4, sfx: 'beep' }, { t: 6.3, sfx: 'lock' }, { t: 7.7, sfx: 'glitch' }, { t: 8.2, sfx: 'impact_soft' }],
  render(t) {
    CAM = camAt(t);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#02050b'; ctx.fillRect(0, 0, W, H);
    // horizon haze
    const hz = proj(CAM.x, 0, CAM.z + 2000);
    const g = ctx.createLinearGradient(0, (hz[1] - 220) * K, 0, (hz[1] + 160) * K);
    g.addColorStop(0, 'rgba(10,20,50,0)'); g.addColorStop(0.7, 'rgba(60,20,90,.35)'); g.addColorStop(1, 'rgba(20,10,40,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // point cloud (additive)
    ctx.globalCompositeOperation = 'lighter';
    const scanR = (t - 0.9) * 260;                            // LiDAR wave radius
    const pw = Math.max(1, 1.6 * K);
    for (let i = 0; i < NP; i++) {
      const p = proj(PX[i], PY[i], PZ[i]);
      if (p[2] < 2 || p[2] > 520) continue;
      const sx = p[0] * K, sy = p[1] * K;
      if (sx < -2 || sx > W + 2 || sy < -2 || sy > H + 2) continue;
      const dist = Math.hypot(PX[i] - CAM.x, PY[i] - CAM.y, PZ[i] - CAM.z);
      const k = PK[i];
      let rev = clamp((scanR - dist) / 30);
      if (rev <= 0) continue;
      const wave = Math.exp(-Math.pow((dist - scanR) / 10, 2));
      const fog = Math.exp(-p[2] / 170);
      let a, col;
      if (k === 1) { col = SIGNC[(PZ[i] | 0) % 3]; a = 0.55 * (0.7 + 0.3 * Math.sin(t * 8 + PZ[i])); }
      else if (k === 2) { col = 'rgba(80,140,255,'; a = 0.35 * fog; }
      else { const dd = clamp(p[2] / 260); col = dd < 0.45 ? 'rgba(95,246,255,' : 'rgba(190,120,255,'; a = (0.12 + 0.8 * fog) * (0.65 + 0.35 * (PY[i] % 3.2 < 0.4 ? 1 : 0.5)); }
      a = a * rev + wave * 0.9;
      if (wave > 0.3) col = 'rgba(230,255,255,';
      const s = p[2] < 40 ? pw * 2 : (p[2] < 90 ? pw * 1.4 : pw);
      ctx.fillStyle = col + Math.min(1, a).toFixed(3) + ')';
      ctx.fillRect(sx, sy, s, s);
    }
    // flying target: running lights + light trail
    const tp = tgtAt(t), tq = proj(...tp);
    if (tq[2] > 2) {
      const r = 340 / tq[2];
      for (let k = 0; k < 14; k++) { const q = proj(tp[0], tp[1], tp[2] - k * 3); ctx.fillStyle = `rgba(255,60,120,${0.5 * (1 - k / 14)})`; ctx.fillRect((q[0] - 2) * K, (q[1] - 1) * K, 5 * K, 3 * K); }
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc((tq[0] - r) * K, tq[1] * K, 3 * K, 0, 7); ctx.arc((tq[0] + r) * K, tq[1] * K, 3 * K, 0, 7); ctx.fill();
      ctx.fillStyle = Math.sin(t * 12) > 0 ? 'rgba(255,40,80,1)' : 'rgba(255,40,80,.2)'; ctx.beginPath(); ctx.arc(tq[0] * K, (tq[1] - r * 0.4) * K, 3.5 * K, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    /* ------------------- HUD ------------------- */
    const boot = (a, d = 0.35) => E.outCubic(clamp((t - a) / d));
    ctx.lineCap = 'square';
    // frame corners
    const b0 = boot(0.1);
    corners(60, 50, 1800, 980, 70 * b0, CY, 2, 0.85);
    // top compass strip
    const hd = ((CAM.yaw * 57.3 + 12 + t * 2) % 360 + 360) % 360;
    const b1 = boot(0.35);
    if (b1 > 0) {
      line(660, 92, 1260, 92, CY, 1, 0.6 * b1);
      for (let d = -30; d <= 30; d += 5) {
        const deg = Math.round(hd / 5) * 5 + d, x = 960 + (deg - hd) * 10;
        if (x < 660 || x > 1260) continue;
        line(x, 92, x, deg % 15 === 0 ? 76 : 84, CY, 1.4, 0.8 * b1);
        if (deg % 15 === 0) txt(String((deg + 360) % 360).padStart(3, '0'), x, 62, 15, CY, 'center', 0.85 * b1);
      }
      ctx.fillStyle = CY; ctx.beginPath(); ctx.moveTo(960 * K, 98 * K); ctx.lineTo(952 * K, 110 * K); ctx.lineTo(968 * K, 110 * K); ctx.fill();
      txt(hd.toFixed(1).padStart(5, '0') + '°', 960, 128, 18, CY, 'center', b1);
    }
    // altitude (left) and speed (right) tapes
    const b2 = boot(0.6);
    if (b2 > 0) {
      const alt = CAM.y * 3.28 + 40, spd = 46 * 3.6 + Math.sin(t) * 6 + E.inOutSine(clamp((t - 2) / 4)) * 60;
      for (const [x0, val, lab, dir] of [[180, alt, 'ALT', 1], [1740, spd, 'SPD', -1]]) {
        line(x0, 300, x0, 780, CY, 1, 0.5 * b2);
        for (let k = -12; k <= 12; k++) {
          const v = Math.round(val / 10) * 10 + k * 10, y = 540 - (v - val) * 2;
          if (y < 300 || y > 780) continue;
          line(x0, y, x0 + dir * (v % 50 === 0 ? 22 : 12), y, CY, 1.3, 0.75 * b2);
          if (v % 50 === 0) txt(String(v), x0 + dir * 34, y, 14, CY, dir > 0 ? 'left' : 'right', 0.7 * b2);
        }
        ctx.globalAlpha = b2; ctx.strokeStyle = CY; ctx.lineWidth = 2 * K; ctx.strokeRect((x0 + (dir > 0 ? 28 : -138)) * K, 522 * K, 110 * K, 36 * K); ctx.globalAlpha = 1;
        txt(val.toFixed(1), x0 + (dir > 0 ? 83 : -83), 540, 19, '#ffffff', 'center', b2, MONO, 700);
        txt(lab, x0 + (dir > 0 ? 28 : -28), 280, 15, CY, dir > 0 ? 'left' : 'right', b2);
      }
    }
    // horizon / pitch ladder
    const b3 = boot(0.8);
    if (b3 > 0) {
      ctx.save(); ctx.translate(960 * K, 540 * K); ctx.rotate(-CAM.roll);
      for (let k = -2; k <= 2; k++) { if (!k) continue; const y = (CAM.pitch * 57.3 + k * 10) * 9; if (Math.abs(y) > 320) continue; ctx.globalAlpha = 0.5 * b3; ctx.strokeStyle = CY; ctx.lineWidth = 1.2 * K; ctx.setLineDash([10 * K, 8 * K]); ctx.beginPath(); ctx.moveTo(-240 * K, y * K); ctx.lineTo(-90 * K, y * K); ctx.moveTo(90 * K, y * K); ctx.lineTo(240 * K, y * K); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.fillStyle = CY; ctx.font = `500 ${13 * K}px ${MONO}`; ctx.textAlign = 'right'; ctx.fillText(String(-k * 10), -250 * K, y * K + 4 * K); }
      ctx.restore();
      // centre gun-sight
      line(930, 540, 950, 540, CY, 2, b3); line(970, 540, 990, 540, CY, 2, b3); line(960, 510, 960, 528, CY, 2, b3);
    }
    // target acquisition -> lock
    if (tq[2] > 2 && t > 2.8) {
      const acq = clamp((t - 2.8) / 3.4);
      const locked = t > 6.25;
      const size = locked ? lerp(70, 46, E.outBack(clamp((t - 6.25) / 0.25))) : lerp(220, 80, E.inOutSine(acq)) + Math.sin(t * 9) * 6 * (1 - acq);
      const col = locked ? PINK : (acq > 0.6 ? AMB : CY);
      const jx = locked ? 0 : Math.sin(t * 7.3) * 18 * (1 - acq), jy = locked ? 0 : Math.cos(t * 6.1) * 14 * (1 - acq);
      const cx = tq[0] + jx, cy = tq[1] + jy;
      ctx.save(); ctx.translate(cx * K, cy * K); ctx.rotate(locked ? Math.PI / 4 * E.outCubic(clamp((t - 6.25) / 0.3)) : t * 0.6 * (1 - acq));
      ctx.translate(-cx * K, -cy * K);
      corners(cx - size / 2, cy - size / 2, size, size, size * 0.28, col, 2.5, Math.min(1, (t - 2.8) * 4));
      ctx.restore();
      if (locked) {
        ctx.globalAlpha = 0.85; ctx.strokeStyle = PINK; ctx.lineWidth = 1.5 * K; ctx.beginPath(); ctx.arc(cx * K, cy * K, (size * 0.95 + 20 * Math.max(0, 1 - (t - 6.25) * 3)) * K, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
        const blink = Math.sin(t * 14) > -0.3;
        if (blink) txt('LOCKED', cx + 70, cy - 46, 22, PINK, 'left', 1, MONO, 700);
        txt(C.lock, cx + 70, cy - 18, 20, PINK, 'left', 1, '"Noto Sans CJK SC"', 700);
      } else {
        txt('ACQUIRING' + '.'.repeat(1 + Math.floor(t * 4) % 3), cx + size / 2 + 16, cy - size / 2 + 10, 16, col, 'left', 1);
      }
      txt(`${C.tgt}  ${(tq[2] * 1.9).toFixed(0)}m`, cx + size / 2 + 16, cy + size / 2 - 6, 16, col, 'left', 0.9);
      // line from the sight to the target
      ctx.globalAlpha = 0.35; ctx.strokeStyle = col; ctx.lineWidth = 1 * K; ctx.setLineDash([6 * K, 6 * K]); ctx.beginPath(); ctx.moveTo(960 * K, 540 * K); ctx.lineTo(cx * K, cy * K); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // radar (bottom left)
    const b4 = boot(1.0);
    if (b4 > 0) {
      const rx = 250, ry = 860, R = 120 * b4;
      ctx.globalAlpha = 0.8; ctx.strokeStyle = CY; ctx.lineWidth = 1.2 * K;
      for (const f of [1, 0.66, 0.33]) { ctx.beginPath(); ctx.arc(rx * K, ry * K, R * f * K, 0, 7); ctx.stroke(); }
      line(rx - R, ry, rx + R, ry, CY, 1, 0.4); line(rx, ry - R, rx, ry + R, CY, 1, 0.4);
      const sw = t * 2.6;
      const sg = ctx.createConicGradient ? ctx.createConicGradient(sw - 0.9, rx * K, ry * K) : null;
      if (sg) { sg.addColorStop(0, 'rgba(95,246,255,0)'); sg.addColorStop(0.14, 'rgba(95,246,255,.35)'); sg.addColorStop(0.15, 'rgba(95,246,255,0)'); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(rx * K, ry * K, R * K, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
      for (let i = 0; i < 9; i++) { const a = h1(i) * 6.28, d = (0.2 + h1(i * 3) * 0.75) * R; const vis = ((sw - a) % 6.283 + 6.283) % 6.283 < 2.5; if (vis) { ctx.fillStyle = i === 0 ? PINK : CY; ctx.fillRect((rx + Math.cos(a) * d - 3) * K, (ry + Math.sin(a) * d - 3) * K, 6 * K, 6 * K); } }
      txt('RADAR · 2.0KM', rx - R, ry - R - 22, 14, CY, 'left', b4);
    }
    // data panel (bottom right)
    const b5 = boot(1.2);
    if (b5 > 0) {
      const x0 = 1430, y0 = 760;
      ctx.globalAlpha = 0.18 * b5; ctx.fillStyle = CY; ctx.fillRect(x0 * K, y0 * K, 400 * K * b5, 220 * K); ctx.globalAlpha = 1;
      corners(x0, y0, 400 * b5, 220, 18, CY, 2, b5);
      const lines = ['SCAN  ' + clamp((t - 0.9) / 3).toFixed(2).replace('0.', '0.') + ' / 1.00', 'PTS   ' + Math.floor(NP * clamp((t - 0.9) / 3)).toLocaleString('en'), 'OBJ   0x' + (0x3f2a + Math.floor(t * 7)).toString(16).toUpperCase(), 'NET   ▮▮▮▮▯  -42dBm', 'MODE  ' + (t > 6.25 ? 'TRACK/LOCK' : 'SEARCH')];
      lines.forEach((s, i) => { const a = clamp((t - 1.3 - i * 0.12) / 0.2); txt(s.slice(0, Math.floor(s.length * a)), x0 + 22, y0 + 32 + i * 34, 16, i === 4 && t > 6.25 ? PINK : CY, 'left', b5); });
      txt('目标识别 · 城市扫描', x0 + 22, y0 + 32 + 5 * 34, 16, '#ffffff', 'left', b5 * 0.85, '"Noto Sans CJK SC"', 600);
    }
    // boot text
    if (t < 1.4) txt('SYSTEM ONLINE' + (Math.floor(t * 8) % 2 ? '_' : ''), 960, 760, 22, CY, 'center', clamp(t * 4) * (1 - clamp((t - 1.1) / 0.3)), MONO, 700);
    // final title
    if (t > 8.0) {
      const a = E.outCubic(clamp((t - 8.0) / 0.4));
      const gl = t < 8.4 ? (Math.random ? 0 : 0) : 0;
      ctx.save();
      ctx.font = `900 ${84 * K}px "Noto Sans CJK SC"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const jit = (1 - a) * 30;
      ctx.globalAlpha = a * 0.8; ctx.fillStyle = PINK; ctx.fillText(C.title, (960 - 4 - jit) * K, 720 * K);
      ctx.fillStyle = CY; ctx.fillText(C.title, (960 + 4 + jit) * K, 720 * K);
      ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; ctx.fillText(C.title, 960 * K, 720 * K);
      ctx.font = `600 ${22 * K}px Inter`; if ('letterSpacing' in ctx) ctx.letterSpacing = `${12 * K}px`;
      ctx.fillStyle = CY; ctx.fillText(C.titleEn, 960 * K, 790 * K); if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.restore();
    }
    /* ------------------- post: glitch slices, RGB split, scanlines ------------------- */
    const gT = [[7.65, 0.28], [3.35, 0.08], [6.22, 0.1]];
    let gAmt = 0; for (const [a, d] of gT) if (t > a && t < a + d) gAmt = Math.max(gAmt, 1 - (t - a) / d);
    if (gAmt > 0) {
      fctx.clearRect(0, 0, W, H); fctx.drawImage(cv, 0, 0);
      for (let i = 0; i < 9; i++) {
        const y = h1(i * 3 + Math.floor(t * 30)) * H, hh = (6 + h1(i * 7 + Math.floor(t * 30)) * 40) * K, off = (h1(i * 11 + Math.floor(t * 30)) - 0.5) * 120 * K * gAmt;
        ctx.drawImage(fx, 0, y, W, hh, off, y, W, hh);
      }
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 * gAmt; ctx.drawImage(fx, 8 * K * gAmt, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  },
});
</script></body></html>
